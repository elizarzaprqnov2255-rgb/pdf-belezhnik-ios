<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PDF бележник</title>
<style>
/* VOICE: тих, бърз инструмент като вградено iOS приложение
   IDEA: лист хартия на сива маса, до него червен молив
   PICTURE: самите страници; празно състояние — лист с червена черта
   COLOUR and TYPE: графит, хартия, червен молив #e0412f; системен шрифт
   LAYOUT: горна лента, страници в средата, инструменти отдолу с палец */
:root{color-scheme:light;--bg:#e4e1dc;--bar:#fbfaf8;--ink:#17181b;--mut:#6d6a65;--line:#d9d5ce;--acc:#e0412f;--chip:#efece7}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0f1012;--bar:#1b1c1f;--ink:#f1efeb;--mut:#9a978f;--line:#2c2d31;--chip:#26272b}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0f1012;--bar:#1b1c1f;--ink:#f1efeb;--mut:#9a978f;--line:#2c2d31;--chip:#26272b}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,.sheet{touch-action:manipulation}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow:hidden;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;min-height:44px;min-width:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.35}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header{background:var(--bar);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 4px) max(env(safe-area-inset-right),8px) 4px max(env(safe-area-inset-left),8px);display:flex;align-items:center;gap:4px}
#name{flex:1;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
#pc{font-variant-numeric:tabular-nums;font-size:15px;color:var(--mut);padding:0 10px;background:var(--chip);min-height:34px;border-radius:17px}
#main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;position:relative}
#pages{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 12px 24px;width:max-content;min-width:100%;transform-origin:50% 0}
.pg{position:relative;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18),0 6px 20px rgba(0,0,0,.10);flex:none}
.pg canvas{position:absolute;inset:0;width:100%;height:100%}
.ink{touch-action:none}
body.view .ink{pointer-events:none}
.pg .n{position:absolute;right:6px;bottom:-1px;transform:translateY(100%);font-size:12px;color:var(--mut);padding-top:2px}
footer{background:var(--bar);border-top:1px solid var(--line);padding:4px max(env(safe-area-inset-right),6px) calc(env(safe-area-inset-bottom) + 4px) max(env(safe-area-inset-left),6px)}
#opts{display:none;align-items:center;gap:5px;padding:6px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:4px;overflow-x:auto}
body.pen #opts,body.hl #opts,body.text #opts{display:flex}
.sw{width:32px;height:32px;min-width:32px;min-height:32px;border-radius:50%;border:2px solid var(--line);flex:none;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--bar),0 0 0 5px var(--ink)}
.sz{min-width:38px;min-height:36px;background:var(--chip);border-radius:18px;flex:none}
.sz span{display:block;border-radius:50%;background:var(--ink)}
.sz.on{background:var(--ink)}.sz.on span{background:var(--bar)}
.sep{width:1px;height:26px;background:var(--line);flex:none;margin:0 4px}
#tools{display:flex;justify-content:space-between;align-items:center}
.t{flex:1;flex-direction:column;gap:1px;font-size:11px;color:var(--mut);max-width:76px}
.t.on{color:var(--acc)}
.t.on svg{stroke-width:2.2}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#empty svg{width:min(62vw,250px);height:auto}
#empty svg.i{width:24px;height:24px;flex:none}
#empty h1{font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
#empty p{margin:0;color:var(--mut);max-width:30ch}
#bHome{padding:0 10px 0 4px;color:var(--acc);font-weight:600;gap:0}
.last{background:var(--bar);border:1px solid var(--line);padding:6px 18px 6px 12px;min-height:56px;border-radius:16px;text-align:left;max-width:min(92vw,360px)}
.last span{display:flex;flex-direction:column;overflow:hidden}.last small{color:var(--mut);font-size:13px}
.last b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{background:var(--acc);color:#fff;font-weight:600;padding:0 26px;min-height:52px;border-radius:26px;font-size:17px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.card{background:var(--bar);width:min(100%,520px);border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:8px}
.card h2{font-size:17px;margin:2px 4px 6px}
.row{justify-content:flex-start;background:var(--chip);padding:0 14px;min-height:52px;text-align:left;width:100%}
.row small{display:block;color:var(--mut);font-size:13px}
textarea,input[type=number]{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;-webkit-user-select:text;user-select:text}
textarea{min-height:96px;resize:vertical}
.acts{display:flex;gap:8px}.acts button{flex:1;background:var(--chip);font-weight:600}.acts .ok{background:var(--acc);color:#fff}
#prev{max-width:100%;max-height:55vh;object-fit:contain;background:#fff;-webkit-touch-callout:default;-webkit-user-select:auto}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 120px);transform:translateX(-50%);background:var(--ink);color:var(--bar);padding:10px 16px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:88vw;text-align:center}
#toast.on{opacity:1}
#busy{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:25;background:rgba(0,0,0,.2)}
#busy.on{display:flex}
#busy div{width:38px;height:38px;border-radius:50%;border:4px solid #fff;border-top-color:var(--acc);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
@media(prefers-reduced-motion:reduce){#busy div{animation-duration:3s}#toast{transition:none}}
</style>

<meta name="theme-color" content="#1b1c1f" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<body class="view">

  <button id="bHome" aria-label="Начален екран" hidden><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Начало</button>

<main id="main">
  <div id="pages"></div>

    <svg viewBox="0 0 240 200" aria-hidden="true">
      <ellipse cx="120" cy="186" rx="86" ry="8" fill="currentColor" opacity=".10"/>
      <rect x="58" y="14" width="124" height="166" rx="6" fill="#fff" stroke="currentColor" stroke-opacity=".15"/>
      <path d="M160 14v22h22" fill="#ece9e4"/>
      <g stroke="#c9c4bc" stroke-width="5" stroke-linecap="round"><path d="M76 52h68M76 68h84M76 84h56M76 128h80M76 144h62"/></g>
      <path d="M74 104c14-10 26 6 40-3s24-8 46 0" fill="none" stroke="#e0412f" stroke-width="5" stroke-linecap="round"/>
      <rect x="118" y="116" width="66" height="22" rx="4" fill="#fff6c9" stroke="#f5c400" stroke-width="2"/>
      <text x="151" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#17181b" font-family="-apple-system,sans-serif">Бележка</text>
      <g transform="rotate(38 196 70)"><rect x="188" y="20" width="14" height="92" rx="3" fill="#e0412f"/><path d="M188 112h14l-7 16z" fill="#f2c9a0"/><path d="M193 124h4l-2 4z" fill="#17181b"/></g>
    </svg>
    <h1>Отвори PDF и пиши върху него</h1>

</main>

  <div id="opts"></div>
  <div id="tools">
    <button class="t on" data-t="view" aria-label="Преглед"><svg class="i" viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12m0-1V4.5a1.5 1.5 0 0 1 3 0V12m0-6.5a1.5 1.5 0 0 1 3 0V13m0-4.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-2a6 6 0 0 1-5-2.7L4 15a1.6 1.6 0 0 1 2.6-1.8L8 15"/></svg>Преглед</button>
    <button class="t" data-t="pen" aria-label="Писалка"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/></svg>Писалка</button>
    <button class="t" data-t="hl" aria-label="Маркер"><svg class="i" viewBox="0 0 24 24"><path d="M9 15l-3 3h5l1-1M9 15l8-10 3 3-9 9zM4 21h16"/></svg>Маркер</button>

  </div>
</footer>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>

<div class="sheet" id="shSave"><div class="card">
  <h2>Запази</h2>

<script type="module">
import * as m from './lib/pdf.min.mjs';
m.GlobalWorkerOptions.workerSrc='./lib/pdf.worker.min.mjs';
window.pdfjsLib=m;dispatchEvent(new Event('pdfjs'));
</script>
<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const main=$('#main'),pagesEl=$('#pages');
const COLORS=['#111111','#e0412f','#1f5fe0','#1a9a52','#f5c400','#ffffff'];
const SIZES={pen:[.003,.006,.012],hl:[.018,.028,.042],text:[.024,.034,.052]};
const S={name:'',bytes:null,pdf:null,P:[],tool:'view',color:{pen:'#e0412f',hl:'#f5c400',text:'#111111'},size:{pen:1,hl:1,text:1},zoom:1,cur:0,undo:[]};
const STANDALONE=!!window.__STANDALONE;
const PDFLIB_URL='./lib/pdf-lib.min.js';
const pdfjsReady=new Promise(r=>{if(window.pdfjsLib)r(window.pdfjsLib);else addEventListener('pdfjs',()=>r(window.pdfjsLib),{once:true})});
let downloads=null;
if(window.claude&&claude.use)claude.use('downloads').then(d=>{downloads=d}).catch(()=>{});

let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)};
const busy=on=>$('#busy').classList.toggle('on',on);
const sheet=(id,on)=>$(id).classList.toggle('on',on);
$$('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s||e.target.closest('[data-x]'))s.classList.remove('on')}));

/* ---------- storage (последният файл) ---------- */
const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('pdfbel',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
async function dbPut(key,v){try{const d=await idb();d.transaction('k','readwrite').objectStore('k').put(v,key)}catch(e){}}
async function dbGet(key){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('k').objectStore('k').get(key);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
// файлът се пази веднъж при отваряне, бележките — отделно и леко
let st;const persist=()=>{clearTimeout(st);st=setTimeout(()=>{if(S.bytes)dbPut('st',{id:S.id,st:S.P.map(p=>({rot:p.rot,items:p.items}))})},400)};

/* ---------- geometry ---------- */
// items live in normalised coords of the page as first shown (rotation 0)
const mapPt=(x,y,W,H,r)=>r===90?[W*(1-y),H*x]:r===180?[W*(1-x),H*(1-y)]:r===270?[W*y,H*(1-x)]:[x*W,y*H];
const unmap=(u,v,r)=>r===90?[v,1-u]:r===180?[1-u,1-v]:r===270?[1-v,u]:[u,v];
const fontOf=px=>`600 ${px}px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif`;
function paint(ctx,items,W,H,r){
  const pw=r%180?H:W;
  for(const it of items){
    ctx.save();
    if(it.t==='pen'){
      if(it.p.length<2)continue;
      ctx.globalAlpha=it.hl?.38:1;ctx.strokeStyle=it.c;ctx.lineWidth=Math.max(1,it.w*pw);ctx.lineCap=it.hl?'butt':'round';ctx.lineJoin='round';
      ctx.beginPath();
      for(let k=0;k<it.p.length;k+=2){const[a,b]=mapPt(it.p[k],it.p[k+1],W,H,r);k?ctx.lineTo(a,b):ctx.moveTo(a,b)}
      if(it.p.length===2){const[a,b]=mapPt(it.p[0],it.p[1],W,H,r);ctx.lineTo(a+.1,b)}
      ctx.stroke();
    }else if(it.t==='text'){
      const fs=it.s*pw,[a,b]=mapPt(it.x,it.y,W,H,r);
      ctx.translate(a,b);ctx.rotate(r*Math.PI/180);ctx.font=fontOf(fs);ctx.fillStyle=it.c;ctx.textBaseline='top';
      if(it.c==='#ffffff'){ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=fs*.12;ctx.lineJoin='round'}
      it.text.split('\n').forEach((l,k)=>{if(it.c==='#ffffff')ctx.strokeText(l,0,k*fs*1.2);ctx.fillText(l,0,k*fs*1.2)});
    }
    ctx.restore();
  }
}
const mctx=document.createElement('canvas').getContext('2d');
function hit(it,x,y,pw,ph,tol){ // unrotated px space
  if(it.t==='pen'){const lw=it.w*pw/2+tol;for(let k=0;k<it.p.length;k+=2){if(Math.hypot(it.p[k]*pw-x,it.p[k+1]*ph-y)<lw)return true}return false}
  const fs=it.s*pw;mctx.font=fontOf(fs);const ls=it.text.split('\n');const w=Math.max(...ls.map(l=>mctx.measureText(l).width));
  const X=it.x*pw,Y=it.y*ph;return x>X-tol&&x<X+w+tol&&y>Y-tol&&y<Y+ls.length*fs*1.2+tol;
}

/* ---------- open ---------- */
$('#bOpen').onclick=$('#bOpen2').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)openBytes(new Uint8Array(await f.arrayBuffer()),f.name.replace(/\.pdf$/i,''),null)};
main.addEventListener('dragover',e=>e.preventDefault());
main.addEventListener('drop',async e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&/pdf/i.test(f.type+f.name))openBytes(new Uint8Array(await f.arrayBuffer()),f.name.replace(/\.pdf$/i,''),null)});

async function openBytes(bytes,name,saved){
  busy(true);
  try{
    const lt=(await pdfjsReady).getDocument({data:bytes.slice(),isEvalSupported:false,...(window.__PDFJS_OPTS||{})}),pdf=await lt.promise;
    closePdf();
    S.pdf=pdf;S.lt=lt;S.bytes=bytes;S.name=name||'Документ';S.undo=[];S.zoom=1;S.cur=0;
    if(!saved){S.id=Date.now()+'';dbPut('doc',{id:S.id,name:S.name,bytes})}
    S.P=[];
    for(let i=1;i<=pdf.numPages;i++){
      const pg=await pdf.getPage(i),v=pg.getViewport({scale:1}),raw=pg.getViewport({scale:1,rotation:0});
      const sv=saved&&saved[i-1];
      S.P.push({w:v.width,h:v.height,rw:raw.width,rh:raw.height,intr:pg.rotate||0,rot:sv?sv.rot:0,items:sv?sv.items:[],el:null,task:null,done:false,vis:false,gen:0});
    }
    $('#name').textContent=S.name;showDoc(true);
    build();main.scrollTop=0;updUndo();if(!saved)persist();
  }catch(err){
    toast(err&&err.name==='PasswordException'?'Файлът е защитен с парола':'Файлът не може да се отвори');
  }finally{busy(false)}
}

function closePdf(){try{if(S.lt)S.lt.destroy()}catch(e){}S.lt=null;S.pdf=null}
function showDoc(on){
  $('#empty').hidden=on;$('#foot').hidden=!on;pagesEl.hidden=!on;
  ['#bHome','#pc','#bZo','#bZi','#bSave'].forEach(s=>$(s).hidden=!on);
  $('#bOpen').hidden=on&&innerWidth<400;
}
async function goHome(){
  clearTimeout(st);if(S.bytes)await dbPut('st',{id:S.id,st:S.P.map(p=>({rot:p.rot,items:p.items}))});
  io.disconnect();S.P.forEach((p,i)=>drop(i));pagesEl.innerHTML='';
  closePdf();
  S.P=[];S.undo=[];setTool('view');
  $('#name').textContent='PDF бележник';showDoc(false);main.scrollTop=0;
  showLast();
}
$('#bHome').onclick=goHome;
let last=null;
async function showLast(){
  const d=await dbGet('doc');last=d&&d.bytes?d:null;
  $('#bLast').hidden=!last;if(last)$('#lastName').textContent=last.name;
}
$('#bLast').onclick=async()=>{if(!last)return;const s=await dbGet('st');S.id=last.id;openBytes(last.bytes,last.name,s&&s.id===last.id?s.st:[])};

/* ---------- pages ---------- */
const io=new IntersectionObserver(es=>{for(const e of es){const i=+e.target.dataset.i;S.P[i].vis=e.isIntersecting;if(e.isIntersecting)render(i);else drop(i)}},{root:main,rootMargin:'120% 0px'});
const baseW=()=>Math.min(main.clientWidth-24,900);
function dims(p){const sw=p.rot%180;const vw=sw?p.h:p.w,vh=sw?p.w:p.h;const cw=Math.round(baseW()*S.zoom);return{cw,ch:Math.round(cw*vh/vw)}}
function build(){
  io.disconnect();pagesEl.innerHTML='';
  S.P.forEach((p,i)=>{
    const el=document.createElement('div');el.className='pg';el.dataset.i=i;
    el.innerHTML='<canvas class="base"></canvas><canvas class="ink"></canvas><span class="n"></span>';
    el.querySelector('.n').textContent=i+1;
    p.el=el;pagesEl.appendChild(el);size(i);bindInk(i);io.observe(el);
  });
  updPc();
}
function size(i){const p=S.P[i],{cw,ch}=dims(p);p.el.style.width=cw+'px';p.el.style.height=ch+'px';p.done=false}
// свободни платна извън екрана — iOS има строг лимит за памет на canvas
function drop(i){const p=S.P[i];p.gen++;if(p.task){p.task.cancel();p.task=null}for(const c of p.el.querySelectorAll('canvas')){c.width=c.height=0}p.done=false}
async function render(i){
  const p=S.P[i];if(p.done)return;p.done=true;const g=++p.gen;
  const {cw,ch}=dims(p),dpr=Math.min(window.devicePixelRatio||1,2);
  let s=dpr;if(cw*ch*s*s>6e6)s=Math.sqrt(6e6/(cw*ch));
  const pg=await S.pdf.getPage(i+1),tot=(p.intr+p.rot)%360;
  const vp1=pg.getViewport({scale:1,rotation:tot}),vp=pg.getViewport({scale:cw/vp1.width*s,rotation:tot});
  const off=document.createElement('canvas');off.width=Math.round(vp.width);off.height=Math.round(vp.height);
  if(g!==p.gen)return;
  if(p.task)p.task.cancel();
  const task=p.task=pg.render({canvasContext:off.getContext('2d'),viewport:vp});
  try{await task.promise}catch(e){return}
  if(p.task===task)p.task=null;
  if(g!==p.gen){off.width=off.height=0;return}
  const c=p.el.querySelector('.base');c.width=off.width;c.height=off.height;c.getContext('2d').drawImage(off,0,0);off.width=off.height=0;
  p.done=2;ink(i);
}
function ink(i){
  const p=S.P[i];if(!p.done)return;
  const {cw,ch}=dims(p),dpr=Math.min(window.devicePixelRatio||1,2),c=p.el.querySelector('.ink');
  if(c.width!==Math.round(cw*dpr)||c.height!==Math.round(ch*dpr)){c.width=Math.round(cw*dpr);c.height=Math.round(ch*dpr)}
  const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,cw,ch);paint(x,p.items,cw,ch,p.rot);
}
function relayout(keep){
  const r=main.scrollHeight?main.scrollTop/main.scrollHeight:0;
  S.P.forEach((p,i)=>{drop(i);size(i)});
  main.scrollTop=r*main.scrollHeight;
  S.P.forEach((p,i)=>{const b=p.el.getBoundingClientRect(),m=main.getBoundingClientRect();if(b.bottom>m.top-m.height&&b.top<m.bottom+m.height)render(i)});
}
const setZoom=z=>{S.zoom=Math.min(4,Math.max(.5,z));relayout()};
$('#bZi').onclick=()=>setZoom(S.zoom*1.25);
$('#bZo').onclick=()=>setZoom(S.zoom/1.25);
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>S.pdf&&relayout(),200)});

function updPc(){$('#pc').textContent=(S.cur+1)+' / '+S.P.length}
main.addEventListener('scroll',()=>{
  // текуща = страницата, която заема най-много от екрана
  const m=main.getBoundingClientRect(),y=m.top+m.height/3;let best=S.cur,bd=1e9;
  S.P.forEach((p,i)=>{if(!p.vis)return;const b=p.el.getBoundingClientRect();const d=b.top<=y&&b.bottom+14>=y?0:Math.min(Math.abs(b.top-y),Math.abs(b.bottom-y));if(d<bd){bd=d;best=i}});
  if(best!==S.cur){S.cur=best;updPc()}
},{passive:true});
$('#pc').onclick=()=>{$('#goIn').value=S.cur+1;$('#goIn').max=S.P.length;sheet('#shGo',true);$('#goIn').focus()};
$('#goOk').onclick=()=>{const n=Math.min(S.P.length,Math.max(1,parseInt($('#goIn').value)||1));sheet('#shGo',false);S.P[n-1].el.scrollIntoView({block:'start'});S.cur=n-1;updPc()};

/* pinch zoom в режим Преглед */
let pinch=null;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
main.addEventListener('touchstart',e=>{if(e.touches.length===2&&S.tool==='view'&&S.pdf)pinch={d:dist(e.touches),k:1}},{passive:true});
main.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){e.preventDefault();pinch.k=Math.min(4/S.zoom,Math.max(.5/S.zoom,dist(e.touches)/pinch.d));pagesEl.style.transform=`scale(${pinch.k})`}},{passive:false});
main.addEventListener('touchend',e=>{if(pinch&&e.touches.length<2){const k=pinch.k;pinch=null;pagesEl.style.transform='';if(Math.abs(k-1)>.03)setZoom(S.zoom*k)}});

/* ---------- tools ---------- */
function setTool(t){
  S.tool=t;document.body.className=t;
  $$('.t[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const o=$('#opts');
  if(SIZES[t]){
    const dots=t==='text'?[12,16,21]:t==='hl'?[10,14,19]:[5,9,14];
    o.innerHTML=COLORS.map(c=>`<button class="sw${S.color[t]===c?' on':''}" data-c="${c}" style="background:${c}" aria-label="Цвят ${c}"></button>`).join('')+'<span class="sep"></span>'+
      dots.map((d,k)=>`<button class="sz${S.size[t]===k?' on':''}" data-z="${k}" aria-label="Размер ${k+1}"><span style="width:${d}px;height:${d}px"></span></button>`).join('');
  }else o.innerHTML='';
}
$('#opts').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.c)S.color[S.tool]=b.dataset.c;
  if(b.dataset.z)S.size[S.tool]=+b.dataset.z;
  setTool(S.tool);
  if(edit&&S.tool==='text'){edit.it.c=S.color.text;edit.it.s=SIZES.text[S.size.text];ink(edit.i);persist()}
});
$$('.t[data-t]').forEach(b=>b.onclick=()=>setTool(b.dataset.t));

function pushUndo(u){S.undo.push(u);if(S.undo.length>200)S.undo.shift();updUndo();persist()}
function updUndo(){$('#bUndo').disabled=!S.undo.length}
$('#bUndo').onclick=()=>{
  const u=S.undo.pop();if(!u)return;const p=S.P[u.i];
  if(u.op==='add')p.items.splice(p.items.indexOf(u.it),1);
  else if(u.op==='del')p.items.splice(Math.min(u.at,p.items.length),0,u.it);
  else if(u.op==='rot'){p.rot=u.prev;drop(u.i);size(u.i);if(p.vis)render(u.i)}
  else if(u.op==='txt'){u.it.text=u.prev}
  if(u.op!=='rot')ink(u.i);updUndo();persist();
};
$('#bRot').onclick=()=>{
  const i=S.cur,p=S.P[i];if(!p)return;
  pushUndo({i,op:'rot',prev:p.rot});p.rot=(p.rot+90)%360;drop(i);size(i);render(i);
  requestAnimationFrame(()=>p.el.scrollIntoView({block:'nearest'}));
};

let edit=null;
function bindInk(i){
  const c=S.P[i].el.querySelector('.ink');let cur=null,raf=0,tap=null;
  const pos=e=>{const p=S.P[i],b=c.getBoundingClientRect();return unmap((e.clientX-b.left)/b.width,(e.clientY-b.top)/b.height,p.rot)};
  const pxs=()=>{const p=S.P[i],{cw,ch}=dims(p);return p.rot%180?[ch,cw]:[cw,ch]};
  const erase=e=>{
    const p=S.P[i],[x,y]=pos(e),[pw,ph]=pxs();
    for(let k=p.items.length-1;k>=0;k--){if(hit(p.items[k],x*pw,y*ph,pw,ph,10)){const it=p.items.splice(k,1)[0];pushUndo({i,op:'del',it,at:k});ink(i);return}}
  };
  c.addEventListener('pointerdown',e=>{
    if(S.tool==='view'||!e.isPrimary)return;
    e.preventDefault();S.cur=i;updPc();
    const p=S.P[i];
    if(S.tool==='erase'){c.setPointerCapture(e.pointerId);cur={erase:1};erase(e);return}
    if(S.tool==='text'){tap={x:e.clientX,y:e.clientY};return}
    c.setPointerCapture(e.pointerId);
    const hl=S.tool==='hl';
    cur={t:'pen',hl,c:S.color[S.tool],w:SIZES[S.tool][S.size[S.tool]],p:pos(e)};
    p.items.push(cur);ink(i);
  });
  c.addEventListener('pointermove',e=>{
    if(!cur)return;
    if(cur.erase){erase(e);return}
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of (evs.length?evs:[e])){const [x,y]=pos(ev);cur.p.push(+x.toFixed(5),+y.toFixed(5))}
    if(!raf)raf=requestAnimationFrame(()=>{raf=0;ink(i)});
  });
  const end=()=>{if(cur&&!cur.erase){pushUndo({i,op:'add',it:cur})}cur=null;tap=null};
  // текстът се отваря при пускане на пръста — така iOS показва клавиатурата
  c.addEventListener('pointerup',e=>{
    if(tap&&S.tool==='text'&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<12){
      const p=S.P[i],[x,y]=pos(e),[pw,ph]=pxs();
      const ex=[...p.items].reverse().find(it=>it.t==='text'&&hit(it,x*pw,y*ph,pw,ph,6));
      openText(i,ex||null,x,y);
    }
    end();
  });
  c.addEventListener('pointercancel',end);
}

function openText(i,it,x,y){
  edit={i,it,x,y};
  $('#tTitle').textContent=it?'Редактирай текста':'Добави текст';
  $('#tIn').value=it?it.text:'';$('#tDel').hidden=!it;
  if(it){S.color.text=it.c;const k=SIZES.text.indexOf(it.s);if(k>=0)S.size.text=k;setTool('text')}
  sheet('#shText',true);$('#tIn').focus();
}
$('#shText').addEventListener('click',e=>{if(!$('#shText').classList.contains('on'))edit=null});
$('#tOk').onclick=()=>{
  const v=$('#tIn').value.replace(/\s+$/,'');const e=edit;sheet('#shText',false);edit=null;if(!e)return;
  const p=S.P[e.i];
  if(e.it){if(!v){const at=p.items.indexOf(e.it);p.items.splice(at,1);pushUndo({i:e.i,op:'del',it:e.it,at})}else if(v!==e.it.text){pushUndo({i:e.i,op:'txt',it:e.it,prev:e.it.text});e.it.text=v}}
  else if(v){const it={t:'text',x:e.x,y:e.y,text:v,c:S.color.text,s:SIZES.text[S.size.text]};p.items.push(it);pushUndo({i:e.i,op:'add',it})}
  ink(e.i);
};
$('#tDel').onclick=()=>{$('#tIn').value='';$('#tOk').onclick()};

/* ---------- save ---------- */
$('#bSave').onclick=()=>sheet('#shSave',true);
const safe=s=>s.replace(/[\\/:*?"<>|]+/g,'_').slice(0,80);
async function pagePng(i){
  const p=S.P[i],pg=await S.pdf.getPage(i+1),tot=(p.intr+p.rot)%360;
  const v1=pg.getViewport({scale:1,rotation:tot}),k=Math.min(3,2200/Math.max(v1.width,v1.height)),vp=pg.getViewport({scale:k,rotation:tot});
  const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  await pg.render({canvasContext:x,viewport:vp}).promise;
  paint(x,p.items,c.width,c.height,p.rot);
  return new Promise(r=>c.toBlob(r,'image/png'));
}
let libP;const pdfLib=()=>libP||(libP=new Promise((res,rej)=>{const s=document.createElement('script');s.src=PDFLIB_URL;s.onload=()=>res(window.PDFLib);s.onerror=()=>{libP=null;rej()};document.head.appendChild(s)}));
async function buildPdf(only){
  const L=await pdfLib();
  const src=await L.PDFDocument.load(S.bytes.slice(),{ignoreEncryption:true});
  let doc=src,idx=S.P.map((_,i)=>i);
  if(only!=null){doc=await L.PDFDocument.create();const [cp]=await doc.copyPages(src,[only]);doc.addPage(cp);idx=[only]}
  const pages=doc.getPages();
  for(let n=0;n<idx.length;n++){
    const p=S.P[idx[n]],dp=pages[n];
    if(p.items.length){
      const k=Math.min(2.5,3600/Math.max(p.rw,p.rh)),c=document.createElement('canvas');
      c.width=Math.round(p.rw*k);c.height=Math.round(p.rh*k);
      paint(c.getContext('2d'),p.items,c.width,c.height,(360-p.intr)%360);
      const png=await doc.embedPng(await (await new Promise(r=>c.toBlob(r,'image/png'))).arrayBuffer());
      const cb=dp.getCropBox();dp.drawImage(png,{x:cb.x,y:cb.y,width:cb.width,height:cb.height});
    }
    dp.setRotation(L.degrees((p.intr+p.rot)%360));
  }
  return new Blob([await doc.save()],{type:'application/pdf'});
}
// 1) запазване от Claude  2) менюто „Сподели“ на iOS (Files, Снимки…)  3) обикновено сваляне
async function offer(name,blob,isPng){
  if(downloads){
    try{await downloads.save({filename:name,data:blob});toast('Запазено');return}
    catch(e){const c=e&&e.code;if(c==='declined')return;if(c==='rate_limited'){toast('Изчакай малко и опитай пак');return}}
  }
  try{
    const f=new File([blob],name,{type:isPng?'image/png':'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  if(STANDALONE){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return}
  if(isPng){$('#prev').src=URL.createObjectURL(blob);sheet('#shImg',true)}
  else toast('Запазването на PDF не е достъпно тук — опитай „като снимка“');
}
$('#shSave').addEventListener('click',async e=>{
  const b=e.target.closest('[data-s]');if(!b)return;sheet('#shSave',false);busy(true);
  const i=S.cur,base=safe(S.name);
  try{
    let blob,name,png=false;
    if(b.dataset.s==='png'){blob=await pagePng(i);name=`${base}-стр${i+1}.png`;png=true}
    else if(b.dataset.s==='page'){blob=await buildPdf(i);name=`${base}-стр${i+1}.pdf`}
    else{blob=await buildPdf(null);name=`${base}-редактиран.pdf`}
    busy(false);await offer(name,blob,png);
  }catch(err){busy(false);toast('Нещо се обърка при запазването')}
});

/* ---------- start ---------- */
setTool('view');
showLast();
setTimeout(()=>{if(!window.pdfjsLib)toast('PDF модулът не се зареди — провери връзката')},10000);
}
</script>
